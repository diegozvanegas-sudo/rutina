# Publica la app en GitHub Pages cada vez que se sube un cambio a main.
# Activar una vez: GitHub → Settings → Pages → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # botón "Run workflow" para publicar a mano

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Antes de publicar: todos los recorridos de punta a punta (tests/e2e/todo.mjs) en Chrome sin ventana, con clics reales.
  # Si uno falla, no se publica. Se intenta 2 veces, por si una falla fue de tiempos de la máquina de GitHub y no de la app
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/Bogota
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Recorridos de punta a punta (e2e)
        run: npm run e2e -- capturas || npm run e2e -- capturas
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-e2e
          path: capturas
          retention-days: 7

  publicar:
    needs: probar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url || steps.despliegue2.outputs.page_url || steps.despliegue3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test # si una prueba falla no se publica
      # La URL y la llave pública de Supabase vienen de .env.production
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      # A veces GitHub falla con "No artifacts named github-pages were found" justo después de subir el paquete (le falta
      # un momento para verlo). En vez de fallar la publicación, espera y lo intenta otra vez: hasta 3 intentos.
      # Si los 3 fallan, la publicación sale en rojo como siempre
      - id: despliegue
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.despliegue.outcome == 'failure'
        run: sleep 60
      - id: despliegue2
        if: steps.despliegue.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.despliegue2.outcome == 'failure'
        run: sleep 120
      - id: despliegue3
        if: steps.despliegue2.outcome == 'failure'
        uses: actions/deploy-pages@v4
