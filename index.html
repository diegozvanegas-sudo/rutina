<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101418">
    <meta name="color-scheme" content="dark">
    <link rel="icon" type="image/png" href="icons/icono-192.png">
    <link rel="apple-touch-icon" href="icons/icono-192.png">
    <title>Rutina</title>
    <!-- Lo que se ve al compartir el enlace (WhatsApp, redes) -->
    <meta name="description" content="Tu entrenamiento, tu comida y tu progreso en un solo lugar. Para quien entrena y para el entrenador que lo acompaña. Funciona sin señal en el gym.">
    <meta property="og:title" content="Rutina: entrenamiento, comida y progreso">
    <meta property="og:description" content="Anota tus series en segundos, sigue tu plan de comida y mira cómo mejoras. Los entrenadores arman planes, siguen a sus clientes y llevan sus cobros.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://diegozvanegas-sudo.github.io/rutina/icons/icono-512.png">
    <meta property="og:url" content="https://diegozvanegas-sudo.github.io/rutina/">
</head>
<body>
<div class="app">
    <header class="top-movil">
        <span class="marca"><span class="logo" aria-hidden="true">🏋️</span><b>Rutina</b></span>
        <button type="button" class="icono menu" data-accion="menu" aria-label="Abrir menú" aria-controls="lateral" aria-expanded="false">☰</button>
    </header>
    <main id="vista"></main>
    <aside id="lateral" aria-label="Menú"></aside>
</div>
<div id="velo" class="velo" data-accion="menu-cerrar" hidden></div>
<div id="flotante" class="flotante" role="timer" hidden></div>
<div id="reproductor" class="reproductor" role="dialog" aria-modal="true" aria-label="Sesión guiada" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="tip" class="tip" role="tooltip" hidden></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
